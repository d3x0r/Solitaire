<link rel="stylesheet" href="/node_modules/@d3x0r/popups/dark-styles.css">
<link rel="stylesheet" href="./style.css">
<div id="controls" class="control-bar">
	<img src="images/thumbnail_solitaire.png" width="100" />
	<div class="display-credits"></div>
	<div class="display-winnings"></div>
	<div class="display-total"></div>
	<div class="display-bet"></div>
	<div class="control-bar-break"></div>
	<input type="image" src="images/buttons/bet_n.png" class="bet-button" onclick="" width="100">
	<input type="image" src="images/buttons/max_n.png" class="max-button" onclick="" width="100">
	<input type="image" src="images/buttons/buy_n.png" class="buy-button" onclick="newGame()" width="100">
	
</div>

<div id="klondike-game" class="game-board">

</div>
<script type="module">
// this gets wrapped with code that provides
// rootId
import {setup} from "./klondike.js";
import {popups} from "./node_modules/@d3x0r/popups/popups.mjs";
const myGameDiv =  (typeof rootId !== 'undefined')?popups.getFilledParent( rootId ): document.body;
const frame = (typeof rootId !== 'undefined')?myGameDiv.host:myGameDiv;//getRootNode();
if( frame.classList.contains ( "auto" ))
	setup( myGameDiv, {fullAuto:true} );
else
	setup( myGameDiv, {fullAuto:false} );

</script>
